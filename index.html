<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Skidlings — tiny cars, big drifts." />
    <meta name="theme-color" content="#FFF8EE" />
    <title>Skidlings</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@600;700;800&family=JetBrains+Mono:wght@700&display=swap"
    />
    <style>
      /* Boot splash: pure HTML/CSS so it paints before any JS loads (M9). */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background: #fff8ee;
        color: #2b2340;
        font-family: 'Fredoka', system-ui, sans-serif;
        transition: opacity 420ms cubic-bezier(0.22, 1, 0.36, 1);
      }
      #boot.done {
        opacity: 0;
        pointer-events: none;
      }
      #boot .logo {
        font-size: clamp(56px, 10vw, 110px);
        font-weight: 700;
        color: #ff5a3c;
        -webkit-text-stroke: 6px #2b2340;
        paint-order: stroke fill;
        text-shadow: 0 8px 0 #2b2340;
      }
      #boot .tire {
        width: 54px;
        height: 54px;
        border-radius: 50%;
        border: 12px solid #3a3350;
        box-shadow: 0 5px 0 #2b2340;
        background: radial-gradient(circle, #fff 0 26%, #3a3350 27%);
        animation: boot-spin 0.8s linear infinite;
        position: relative;
      }
      #boot .tire::after {
        content: '';
        position: absolute;
        top: -10px;
        left: 50%;
        width: 6px;
        height: 12px;
        margin-left: -3px;
        background: #ffc933;
        border-radius: 3px;
      }
      #boot .hint {
        font-family: 'Nunito', system-ui, sans-serif;
        font-size: 14px;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #6b6385;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .tire {
          animation-duration: 3s;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot" role="status" aria-live="polite">
      <div class="logo">Skidlings</div>
      <div class="tire" aria-hidden="true"></div>
      <div class="hint">Warming up the tires…</div>
    </div>
    <div id="root"></div>
    <noscript>Skidlings needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
